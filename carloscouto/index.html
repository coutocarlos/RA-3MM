<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EloOne - Realidade Aumentada</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #info {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 10;
      background: rgba(255,255,255,.90); padding: 10px; border-radius: 8px;
      text-align: center; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="info">Autoriza a câmara e aponta para o marcador HIRO.</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="eloone-model" src="eloone.glb"></a-asset-item>
    </a-assets>

    <a-marker id="hiro" preset="hiro" emitevents="true">
      <a-entity
        gltf-model="#eloone-model"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const info = document.getElementById('info');
    const marker = document.getElementById('hiro');
    marker.addEventListener('markerFound', () => {
      info.textContent = 'Marcador detetado - EloOne em Realidade Aumentada.';
    });
    marker.addEventListener('markerLost', () => {
      info.textContent = 'Aponta novamente para o marcador HIRO.';
    });
  </script>
</body>
</html>
