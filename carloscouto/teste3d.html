<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste 3D - EloOne</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial;background:#f3f5f7}
model-viewer{width:100%;height:100%}
.info{position:fixed;z-index:10;left:12px;top:12px;background:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 2px 10px #0002}
</style>
</head>
<body>
<div class="info"><b>Teste do EloOne</b><br>Arrasta para rodar e usa a roda do rato para zoom.</div>
<model-viewer src="eloone.glb" camera-controls auto-rotate shadow-intensity="1" environment-image="neutral"></model-viewer>
</body>
</html>
